[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ultimate-manga-tools-service"
version = "0.1.0"
description = "Private AI translation and image-editing service for Ultimate Manga Tools"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "openai>=1.100,<3",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
umt-server = "umt_server.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["umt_server*"]
